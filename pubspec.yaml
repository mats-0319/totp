name: totp
description: "一个符合RFC 6238标准的计算TOTP Code的android应用"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  # 基础库
  base32: ^2.2.0
  crypto: ^3.0.7
  path_provider: ^2.1.6
  provider: ^6.1.5+1

  # 功能库
  markdown_widget: ^2.3.2+8
  mobile_scanner: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  otp: ^3.2.0
  # 测试里替换 path_provider 的平台实现，把存储目录指到临时目录
  path_provider_platform_interface: ^2.1.3

flutter:
  assets:
    - assets/logo_256.png
    - doc/manual.md
    - doc/tech.md
    - doc/totp_design.png

  uses-material-design: true # 将Icons打包进app
